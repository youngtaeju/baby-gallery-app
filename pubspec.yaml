name: family_gallery
description: "가정용 NAS의 사진과 영상을 가족 구성원만 조회하는 갤러리 앱"
publish_to: 'none'

# versionName+versionCode. 빌드 시 --build-name / --build-number로 재정의 가능.
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.4.2
  dio: ^5.11.0
  dio_cache_interceptor: ^4.0.7
  http_cache_file_store: ^2.0.2
  path_provider: ^2.1.6
  # 11.x는 compileSdk 37 요구. 로컬 SDK가 android-37.0으로 설치되어 미해결.
  flutter_secure_storage: ^10.0.0
  photo_view: ^0.15.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
